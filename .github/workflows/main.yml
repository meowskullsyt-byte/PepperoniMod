
name: Build Pepperoni Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find and build mod
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          BUILD_FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find settings.gradle!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload Pepperoni JAR
        uses: actions/upload-artifact@v4
        with:
          name: PepperoniMod-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
