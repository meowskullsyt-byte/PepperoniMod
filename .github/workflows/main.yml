
name: Build Pepperoni Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Pepperoni
        working-directory: PepperoniMod_GitHub_Actions_Build
        run: gradle build --no-daemon

      - name: Upload Pepperoni JAR
        uses: actions/upload-artifact@v4
        with:
          name: PepperoniMod-JAR
          path: PepperoniMod_GitHub_Actions_Build/build/libs/*.jar
          if-no-files-found: error
