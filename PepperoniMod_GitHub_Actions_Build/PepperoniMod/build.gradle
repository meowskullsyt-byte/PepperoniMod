plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.pepperoni'
version = '1.0.0'
archivesBaseName = 'pepperoni'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                pepperoni { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [mod_id: 'pepperoni', mod_name: 'Pepperoni', mod_version: project.version,
                             mod_authors: 'Pepperoni Mod Team', mod_description: 'Adds Pepperoni, a friendly custom companion mob.']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'pepperoni',
            'Specification-Vendor': 'Pepperoni Mod Team',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Pepperoni Mod Team'
        ])
    }
    finalizedBy 'reobfJar'
}
